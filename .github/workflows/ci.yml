name: Fast PR CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*"
      - ".github/workflows/**"
  push:
    branches-ignore:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Fast Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - name: Install dependencies (editable)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" --no-build-isolation

      - name: Run ruff (if available)
        run: |
          if python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('ruff') else 1)"; then
            python -m ruff check src tests
          else
            echo "ruff not installed in dev extras; skipping"
          fi

      - name: Run mypy
        run: python -m mypy src

      - name: Run smoke tests
        run: python -m pytest -q -m "smoke and not slow"

      - name: Run fast pytest suite
        run: python -m pytest -q -m "not slow"
