name: Full Validation CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "data/**"
      - "docs/**"
      - "pyproject.toml"
      - "mkdocs.yml"
      - "requirements*"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-test-matrix:
    name: Full Scientific Test Matrix (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        mode: [core, plot]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/full-validation.yml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" --no-build-isolation
          if [ "${{ matrix.mode }}" = "plot" ]; then
            python -m pip install -e ".[plot]" --no-build-isolation
          fi

      - name: Run full pytest suite
        run: python -m pytest -q

      - name: Run smoke scripts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.mode }}" = "plot" ]; then
            bash scripts/00_smoke_test.sh --plot
          else
            bash scripts/00_smoke_test.sh
          fi

      - name: Run smoke scripts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if ("${{ matrix.mode }}" -eq "plot") {
            powershell -ExecutionPolicy Bypass -File scripts\00_smoke_test.ps1 -Plot
          } else {
            powershell -ExecutionPolicy Bypass -File scripts\00_smoke_test.ps1
          }

  artifacts-validation:
    name: Build and Validate Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/full-validation.yml
      - name: Build package artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel install/import
        run: |
          python -m pip install dist/*.whl
          python -c "import gan_mg; print(gan_mg.__version__)"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz

  benchmarks-and-repro:
    name: Benchmark and Reproducibility Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/full-validation.yml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-build-isolation
      - name: Run benchmark smoke
        run: |
          python scripts/benchmark_thermo.py --rows 1000 5000 --outdir results/benchmarks_ci --chunksize 500
      - name: Upload benchmark summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-smoke-summary
          path: results/benchmarks_ci/thermo_benchmarks.jsonl
